<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
/* Layout: one narrow column, dark-brown header band, bottom tab bar per role. Warm cream ground, white cards, orange-red actions, gold accents. Single committed light look. */
:root{
  --bg:#faf3ec; --surface:#ffffff; --ink:#1d1310; --mute:#7b6a61; --line:#eadfd5;
  --brand:#d83a0c; --on-brand:#ffffff; --soft:#fdeadd;
  --head:#3b1c11; --gold:#f9b93a;
  --blue:#f9b93a; --on-blue:#2a1405; --danger:#b3261e;
  --warn-bg:#fff1d6; --warn:#7a4a00;
  --offer-a:#f26100; --offer-b:#3f1d11;
  --font:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-block:0 88px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;min-width:0}
button,input,select{font-family:inherit;font-size:1rem}
.hdr{background:var(--head);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-radius:10px}
.hdr b{display:block;font-weight:800;font-size:1.15rem;letter-spacing:.02em;color:var(--gold)}
.hdr small{opacity:.8}
.sy{background:none;border:0;color:#fff;font:inherit;font-size:.75rem;opacity:.9;margin-inline-start:10px;padding:2px 4px;cursor:pointer}
.sy::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;background:#a89a90}
.sy.on::before{background:#4ade80}
.sy.err::before{background:#ff6b5a}
.ver{display:inline-block;font-size:.7rem;font-weight:800;border:1px solid currentColor;border-radius:99px;padding:0 8px;margin-inline-start:8px;vertical-align:middle;letter-spacing:.04em}
.ver-line{text-align:center;color:var(--blue);font-weight:600;font-size:.9rem;margin:-14px 0 20px}
.link{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px}
main{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card.hero{background:linear-gradient(135deg,var(--offer-a),var(--offer-b));color:#fff;border-color:transparent}
.card.hero .k{color:inherit;opacity:.8}
h2{font-size:1.05rem;margin:0 0 6px;font-weight:800;text-wrap:balance}
h3{font-size:.95rem;margin:6px 0 0;font-weight:800}
.k{color:var(--mute);font-size:.88rem}
.big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.line>span{color:var(--mute)}
.line.b>b,.line.b>span{color:var(--ink);font-weight:800}
.line.pos>b{color:var(--brand)}
.err{color:var(--danger);margin:6px 0 0;font-size:.92rem}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;background:var(--brand);color:var(--on-brand);font-weight:800;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--blue);color:var(--on-blue)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.tabs button:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pair{display:flex;gap:8px}.pair>*{flex:1}
label{display:block;margin-top:10px;color:var(--mute);font-size:.88rem}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:13px 4px;color:var(--mute);font-weight:600;cursor:pointer}
.tabs button.on{color:var(--brand);border-top-color:var(--brand);font-weight:800}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.off{background:var(--warn-bg);color:var(--warn)}
.home{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:4px}
.logo{font-size:2.4rem;font-weight:800;text-align:center;color:var(--brand);letter-spacing:.03em}
.tag{text-align:center;color:var(--mute);margin-bottom:22px}
.pick{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:600;color:var(--ink);cursor:pointer}
.mono{direction:ltr;unicode-bidi:plaintext;display:inline-block}
.seg{display:flex;gap:6px;margin:6px 0 12px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--mute);font-weight:700;cursor:pointer}.seg button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sub{color:var(--mute);font-size:.85rem;margin-top:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cphoto{display:block;width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;margin-bottom:8px}
.filebtn{position:relative;overflow:hidden;cursor:pointer;font-size:1rem;text-align:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.search input{border-radius:99px;padding:12px 18px;background:var(--surface);margin:0}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.offer{flex:0 0 86%;min-width:0;scroll-snap-align:start;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--offer-a),var(--offer-b));border:1px solid var(--line)}
.offer,.offer h2{color:#fff}
.offer .k{color:rgba(255,255,255,.82)}
.offer h2{font-size:1.15rem;margin:2px 0}
.offer p{margin:0}
.obtn{background:var(--blue);color:var(--on-blue);border:0;border-radius:99px;padding:8px 20px;font-weight:800;margin-top:12px;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cat{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;cursor:pointer;min-width:0;padding:0}
.cat i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.tabs{align-items:flex-end}
.fab{flex:0 0 78px;position:relative}
.tabs .fab button{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:4px solid var(--bg);background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;padding:0;flex:none}
#shotimg{display:block;max-width:100%;max-height:220px;border-radius:8px;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:30;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="toast" role="status" aria-live="polite" dir="rtl"></div>

<script>
/* ---------- محرك الحسابات (نفس محرك التطبيق، مختبر على مثال الملف) ---------- */
const r2 = x => Math.round(x * 100) / 100;
const uid = p => p + Math.random().toString(36).slice(2, 9);
const find = (arr, id, msg) => { const x = arr.find(a => a.id === id); if (!x) throw new Error(msg); return x; };
const log = (actor, action, detail) => S.audit.unshift({ t: Date.now(), actor, action, detail: String(detail ?? '') });

const initial = () => ({
  settings: { commission: 6, cashback: 4, invoiceMinutes: 15, claimHours: 24, autoApprove: true },
  platform: 0,
  merchants: [{ id: 'm1', name: 'مطعم الأصيل', cat: 'restaurants', status: 'active', barPrefix: '', barLen: 0, digital: 0, funded: 0, real: 0, bank: 0, bankName: '', bankAccount: '' }],
  customers: [{ id: 'c1', name: 'أحمد', wallet: 0 }],
  topups: [], invoices: [], txns: [], audit: [], banks: [], claims: []
});

const normPhone = p => { let d = String(p || '').replace(/[\u0660-\u0669]/g, x => x.charCodeAt(0) - 1632).replace(/\D/g, ''); if (d.startsWith('00218')) d = '0' + d.slice(5); else if (d.startsWith('218')) d = '0' + d.slice(3); else if (d.length === 9 && d[0] === '9') d = '0' + d; return /^09[24]\d{7}$/.test(d) ? d : ''; };
const MGR_PHONE = '0946563895';
const hashStr = s => { let x = 5381; for (let i = 0; i < s.length; i += 7) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0) + ':' + s.length; };

const L = {
  addMerchant(name, cat, phone) {
    if (!name.trim()) throw new Error('اكتب اسم المحل');
    const ph = normPhone(phone);
    if (!ph) throw new Error('اكتب رقم ليبيانا صحيح (يبدأ بـ 092 أو 094، مثال 0921234567)');
    if (S.merchants.some(x => x.phone === ph)) throw new Error('رقم الهاتف مستخدم لمحل آخر');
    const m = { id: uid('m'), name: name.trim(), phone: ph, cat: cat || 'shops', status: 'pending', barPrefix: '', barLen: 0, digital: 0, funded: 0, real: 0, bank: 0, bankName: '', bankAccount: '' };
    S.merchants.push(m); log('system', 'تسجيل تاجر', m.name); return m;
  },
  addCustomer(name, phone) {
    if (!name.trim()) throw new Error('اكتب الاسم');
    const ph = normPhone(phone);
    if (!ph) throw new Error('اكتب رقم ليبيانا صحيح (يبدأ بـ 092 أو 094، مثال 0921234567)');
    if (S.customers.some(x => x.phone === ph)) throw new Error('رقم الهاتف مستخدم لحساب آخر');
    const c = { id: uid('c'), name: name.trim(), phone: ph, wallet: 0 };
    S.customers.push(c); log('system', 'تسجيل زبون', c.name); return c;
  },
  setMerchantCat(mid, cat) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    if (cat) m.cat = cat;
    log(mid, 'تحديث نوع النشاط', m.cat);
  },
  requestTopup(mid, amount, ref) {
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    ref = String(ref || '').trim();
    if (ref.length < 4) throw new Error('اكتب رقم عملية التحويل (من رسالة ليبيانا)');
    if (S.topups.some(x => x.status !== 'rejected' && String(x.ref || '').toLowerCase() === ref.toLowerCase())) throw new Error('رقم العملية هذا مستخدم من قبل');
    const t = { id: uid('t'), mid, amount, ref, phone: m.phone || '', status: 'pending', at: Date.now() };
    S.topups.unshift(t); log(mid, 'طلب شحن', amount); return t;
  },
  approveTopup(id) {
    const t = find(S.topups, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    const m = find(S.merchants, t.mid, 'تاجر غير موجود');
    m.digital = r2(m.digital + t.amount); m.funded = r2((m.funded || 0) + t.amount);
    t.status = 'approved';
    log('admin', 'موافقة شحن', `${m.name} ${t.amount} (عملية ${t.ref || '-'})`);
  },
  rejectTopup(id) {
    const t = find(S.topups, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    t.status = 'rejected'; log('admin', 'رفض شحن', `${t.mid} ${t.amount}`);
  },
  createInvoice(mid, amount) {
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    find(S.merchants, mid, 'تاجر غير موجود');
    let code; do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (S.invoices.some(i => i.code === code));
    const inv = { id: uid('inv'), code, mid, amount, exp: Date.now() + S.settings.invoiceMinutes * 60000, used: false };
    S.invoices.unshift(inv); log(mid, 'إنشاء فاتورة', `${code} / ${amount}`); return inv;
  },
  // طلب كاش باك بفاتورة مصورة. منع التكرار: نفس المحل + نفس رقم الفاتورة، أو نفس المحل + نفس الباركود.
  submitClaim(cid, o) {
    const c = find(S.customers, cid, 'زبون غير موجود');
    const m = find(S.merchants, o.mid, 'اختر محل من القائمة. الكاش باك فقط من المحلات المسجلة في التطبيق.');
    if (m.status !== 'active') throw new Error('هذا المحل مش مفعّل في التطبيق. الكاش باك فقط من المحلات المسجلة والمفعّلة.');
    const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
    const no = String(o.no || '').trim(), bar = String(o.barcode || '').trim(), amount = Number(o.amount);
    if (!no) throw new Error('اكتب رقم الفاتورة');
    if (!o.date || !o.time) throw new Error('اكتب تاريخ الفاتورة وساعتها');
    if (!bar) throw new Error('اكتب رقم الباركود المطبوع تحت الخطوط');
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    if (!o.photo) throw new Error('صوّر الفاتورة أولاً');
    const bp = (m.barPrefix || '').toLowerCase(), bl = Number(m.barLen) || 0;
    if ((bp && !bar.toLowerCase().startsWith(bp)) || (bl && bar.length !== bl)) throw new Error('الباركود ما يطابق فواتير هذا المحل. تأكد إنك اخترت المحل الصحيح.');
    const at = new Date(o.date + 'T' + o.time).getTime();
    if (isNaN(at)) throw new Error('التاريخ أو الساعة غير صحيحة');
    if (at > Date.now() + 5 * 60000) throw new Error('تاريخ الفاتورة في المستقبل');
    const hours = S.settings.claimHours || 24;
    if (Date.now() - at > hours * 3600000) throw new Error(`انتهت مدة المطالبة (${hours} ساعة من وقت الفاتورة)`);
    if (S.claims.some(x => x.mid === m.id && x.status !== 'rejected' && (norm(x.no) === norm(no) || norm(x.barcode) === norm(bar)))) throw new Error('هذي الفاتورة مسجلة من قبل');
    const ph = hashStr(o.photo);
    if (S.claims.some(x => x.status !== 'rejected' && x.ph === ph)) throw new Error('هذي الصورة مستخدمة في فاتورة سابقة');
    const maxDaily = S.settings.maxDaily || 5, maxInv = S.settings.maxInvoice || 2000;
    if (S.claims.filter(x => x.cid === c.id && x.status !== 'rejected' && x.created > Date.now() - 86400000).length >= maxDaily) throw new Error(`وصلت للحد اليومي (${maxDaily} فواتير في 24 ساعة)`);
    const cl = { id: uid('cl'), mid: m.id, cid: c.id, no, barcode: bar, date: o.date, time: o.time, at, amount, photo: o.photo, ph, status: 'pending', created: Date.now() };
    let review = '';
    if (!(bp || bl)) review = 'لم تُضبط شروط الباركود لهذا المحل';
    else if (amount > maxInv) review = `المبلغ أكبر من ${maxInv} د.ل`;
    else if (S.settings.autoApprove === false) review = 'اعتماد المدير مفعّل';
    if (review) cl.review = review; else L.settleClaim(cl);
    S.claims.unshift(cl); log(c.id, 'طلب كاش باك بفاتورة', `${m.name} #${no} / ${amount}`); return cl;
  },
  // اعتماد الفاتورة: ينقص رقمي المحل بقيمة الفاتورة، والكاش باك من محفظة CASH BACK إلى محفظة الزبون
  settleClaim(cl) {
    const m = find(S.merchants, cl.mid, 'تاجر غير موجود'), c = find(S.customers, cl.cid, 'زبون غير موجود');
    const fee = r2(cl.amount * S.settings.commission / 100), cb = r2(cl.amount * S.settings.cashback / 100), mg = r2(fee - cb);
    if (m.digital < fee) throw new Error('رصيد المحل غير كافٍ لدفع العمولة، لازم يشحن محفظته');
    m.digital = r2(m.digital - fee); S.platform = r2(S.platform + mg); c.wallet = r2(c.wallet + cb);
    cl.status = 'approved'; cl.cashback = cb;
    const tx = { id: uid('x'), t: Date.now(), mid: m.id, cid: c.id, amount: cl.amount, cashback: cb, fee, method: 'claim' };
    S.txns.unshift(tx); log('system', 'كاش باك بفاتورة', `${m.name} #${cl.no} / ${cl.amount} كاش باك ${cb}`); return tx;
  },
  reviewClaim(id, ok) {
    const cl = find(S.claims, id, 'الطلب غير موجود');
    if (cl.status !== 'pending') throw new Error('الطلب تمت معالجته');
    if (ok) { const tx = L.settleClaim(cl); log('admin', 'اعتماد فاتورة', `${cl.no} / ${cl.amount}`); return tx; }
    cl.status = 'rejected'; log('admin', 'رفض فاتورة', `${cl.no} / ${cl.amount}`); return true;
  },
  setAutoApprove(on) { S.settings.autoApprove = !!on; log('admin', 'اعتماد الفواتير', on ? 'تلقائي' : 'مراجعة المدير'); },
  setBarcodeFormat(mid, prefix, len) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    prefix = String(prefix || '').trim(); len = String(len || '').trim();
    if (prefix && !/^[A-Za-z0-9-]{1,12}$/.test(prefix)) throw new Error('البادئة حروف وأرقام فقط (حتى 12)');
    if (len && !/^\d{1,20}$/.test(len)) throw new Error('الطول لازم يكون رقم');
    m.barPrefix = prefix; m.barLen = len ? Number(len) : 0;
    log('admin', 'شروط باركود المحل', `${m.name}: ${prefix || '-'} / ${m.barLen || '-'}`);
  },
  setMerchantStatus(mid) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    m.status = m.status === 'active' ? 'suspended' : 'active';
    log('admin', m.status === 'active' ? 'تفعيل محل' : 'إيقاف محل', m.name);
  },
  setLimits(maxInvoice, maxDaily) {
    maxInvoice = Number(maxInvoice); maxDaily = Number(maxDaily);
    if (!(maxInvoice > 0) || !(maxDaily >= 1)) throw new Error('الحدود غير صحيحة');
    S.settings.maxInvoice = maxInvoice; S.settings.maxDaily = Math.floor(maxDaily);
    log('admin', 'تعديل الحدود', `${maxInvoice} د.ل / ${S.settings.maxDaily} فواتير`);
  },
  setClaimHours(hh) {
    hh = Number(hh);
    if (!(hh > 0 && hh <= 720)) throw new Error('مدة المطالبة لازم تكون بين 1 و720 ساعة');
    S.settings.claimHours = hh; log('admin', 'تعديل مدة المطالبة', hh + ' ساعة');
  },
  checkInvoice(code) {
    const inv = S.invoices.find(i => i.code === code);
    if (!inv) throw new Error('كود الفاتورة غير صحيح');
    if (inv.used) throw new Error('الفاتورة مدفوعة من قبل');
    if (Date.now() > inv.exp) throw new Error('انتهت صلاحية الفاتورة');
    return inv;
  },
  // method: 'card' (كاش باك للزبون) أو 'wallet' (دفع من رصيد محفظة الزبون، بدون كاش باك)
  payInvoice(code, cid, method = 'card') {
    const inv = L.checkInvoice(code);
    const m = find(S.merchants, inv.mid, 'تاجر غير موجود');
    const c = find(S.customers, cid, 'زبون غير موجود');
    let cb = 0, fee = 0;
    if (method === 'wallet') {
      if (c.wallet < inv.amount) throw new Error('رصيد محفظتك غير كافٍ لهذه الفاتورة');
      c.wallet = r2(c.wallet - inv.amount); m.digital = r2(m.digital + inv.amount);
    } else {
      fee = r2(inv.amount * S.settings.commission / 100); cb = r2(inv.amount * S.settings.cashback / 100);
      if (m.digital < fee) throw new Error('رصيد التاجر غير كافٍ لدفع العمولة، لازم يشحن محفظته');
      m.digital = r2(m.digital - fee); S.platform = r2(S.platform + r2(fee - cb)); c.wallet = r2(c.wallet + cb);
    }
    inv.used = true;
    const tx = { id: uid('x'), t: Date.now(), mid: m.id, cid, amount: inv.amount, cashback: cb, fee, method };
    S.txns.unshift(tx); log(cid, 'دفع فاتورة', `${m.name} ${inv.amount} (${method === 'wallet' ? 'محفظة' : 'بطاقة'}) كاش باك ${cb}`); return tx;
  },
  addBank(o) {

    const b = { id: uid('b'), name: o.name.trim(), holder: o.holder.trim(), number: o.number.trim(), kind: o.kind, hasKey: !!o.hasKey, status: 'غير مربوط' };
    S.banks.push(b); log('admin', 'إضافة حساب بنكي', `${b.name} ****${b.number.slice(-4)}`); return b;
  },
  linkBank(id) {
    const b = find(S.banks, id, 'الحساب غير موجود');

  }

function merchant() {
  const m = find(S.merchants, ui.actor, 'x');
  const sales = S.txns.filter(t => t.mid === m.id);
  const total = sales.reduce((a, t) => a + t.amount, 0), cbp = sales.reduce((a, t) => a + t.cashback, 0);
  let body;
  if (ui.tab === 'home') {
    const funded = Math.max(m.funded || 0, m.digital), pct = funded ? Math.max(0, Math.min(100, m.digital / funded * 100)) : 0;
    const feesPaid = sales.reduce((a, t) => a + (t.fee != null ? t.fee : (t.method === 'wallet' ? 0 : t.amount * S.settings.commission / 100)), 0);
    body = `${m.status === 'active' ? '' : `<div class="note">${m.status === 'pending' ? 'حسابك بانتظار موافقة المدير. ما يظهر للزبائن لين يتفعل.' : 'حسابك موقوف. تواصل مع المدير.'}</div>`}<div class="card"><h2>رصيد محفظتك</h2><div class="big">${fmt(m.digital)}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${m.digital <= 20 ? '<p class="err">رصيدك قارب على الانتهاء، اشحن محفظتك</p>' : ''}<div class="k">من كل بيعة تنخصم عمولة ${S.settings.commission}% من رصيدك</div></div>
      <div class="card">${line('عمولات مدفوعة', fmt(feesPaid), 'b')}${line('إجمالي المبيعات', fmt(total))}${line('كاش باك للزبائن', fmt(cbp))}${line('عدد العمليات', sales.length)}</div>
      <h3>سجل العمليات</h3>
      ${sales.map(t => { const c = S.customers.find(x => x.id === t.cid); return `<div class="card">${line(esc(c && c.name) + ' • ' + hm(t.t), fmt(t.amount), 'b')}</div>`; }).join('') || '<p class="k">ما فيش عمليات بعد.</p>'}`;
  } else if (ui.tab === 'topup') {
    body = `<div class="card"><h2>طلب شحن</h2>
      <div class="note"><b>1)</b> حوّل رصيد ليبيانا للرقم:<div class="big" dir="ltr" style="font-size:1.6rem;text-align:center">${MGR_PHONE}</div><b>2)</b> اكتب المبلغ ورقم العملية (من رسالة ليبيانا) هنا. <b>3)</b> المدير يتأكد ويوافق وينزل المبلغ كامل في محفظتك.</div>
      <label for="tp">المبلغ (د.ل)</label><input id="tp" inputmode="decimal" value="100">
      <label for="tp_ref">رقم عملية التحويل</label><input id="tp_ref" dir="ltr" autocomplete="off">
      <p class="k" id="tpnet"></p><button class="btn" data-act="topup">إرسال الطلب للمدير</button></div>
      ${S.topups.filter(t => t.mid === m.id).map(t => `<div class="card">${line({ pending: 'قيد المراجعة', approved: 'تمت الموافقة', rejected: 'مرفوض' }[t.status], fmt(t.amount), 'b')}<div class="k">عملية: <span class="mono">${esc(t.ref || '-')}</span></div></div>`).join('')}`;
  } else {
    body = `<div class="card"><h2>بيانات المحل</h2>
      ${line('رقم ليبيانا', '<span class="mono" dir="ltr">' + esc(m.phone || '-') + '</span>')}
      <label for="mb_cat" style="margin-top:0">نوع النشاط</label><select id="mb_cat">${CATS.map(([k, n]) => `<option value="${k}" ${m.cat === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <button class="btn" data-act="mbank">حفظ</button></div>`;
  }
  return shell('تاجر: ' + esc(m.name), [['home', 'الرئيسية'], ['topup', 'شحن'], ['bank', 'بيانات المحل']], body);
}

    body += `<h3>فواتير بانتظار المراجعة (${pcl.length})</h3>` + (pcl.length ? pcl.map(x => {

function render() {
  S.merchants.forEach(m => { if (!CATS.some(c => c[0] === m.cat)) m.cat = 'shops'; });
  const app = $('#app');
  const route = location.hash === '#admin' ? 'admin' : 'main';
  const role = auth.profile && auth.profile.role;
  let html;
  if (!auth.ready) html = loadingHtml('جاري التحميل...');
  else if (route === 'admin') {
    if (!isAdmin()) html = adminLogin();
    else { if (!['overview', 'merchants', 'requests', 'settings'].includes(ui.tab)) ui.tab = 'overview'; html = admin(); }
  }
  else if (!auth.user) html = authHtml();
  else if (!auth.profile) html = loadingHtml(auth.profileErr || 'جاري تحميل حسابك...', true);
  else if (role === 'admin') html = authHtml();
  else if (role === 'customer' && S.customers.some(c => c.id === ui.actor)) { if (!['home', 'stores', 'wallet', 'me', 'claim'].includes(ui.tab)) ui.tab = 'home'; html = customer(); }
  else if (role === 'merchant' && S.merchants.some(m => m.id === ui.actor)) { if (!['home', 'topup', 'bank'].includes(ui.tab)) ui.tab = 'home'; html = merchant(); }
  else html = loadingHtml('جاري مزامنة حسابك...', true);
  app.innerHTML = html;
  const tp = $('#tp'); if (tp) updNet();
  fetchPhotos();
}
function updNet() { const tp = $('#tp'), n = $('#tpnet'); if (tp && n) n.textContent = 'صافي الرقمي بعد الموافقة: ' + fmt(Number(tp.value || 0) * (1 - S.settings.commission / 100)); }

/* ---------- الأحداث ---------- */
function busy(on) { auth.busy = on; document.querySelectorAll('#app .btn').forEach(b => { b.disabled = on; }); }
const A = {
  tab(v) { ui.tab = v; render(); },
  want(v) { auth.want = v || null; auth.mode = 'login'; auth.fail = ''; render(); },
  authmode(v) { auth.mode = v; auth.fail = ''; render(); },
  async exit() {
    ui.last = null; ui.claimPhoto = null; ui.claimMid = null; ui.q = ''; ui.cat = 'all'; ui.role = null; ui.actor = null; auth.profile = null; auth.fail = ''; auth.mode = 'login'; auth.want = null;
    try { if (fdb && dirty) { clearTimeout(pushT); await pushNow(); } if (fbAuth) await fbAuth.signOut(); else render(); } catch (e) { render(); }
  },
  async login() {
    if (auth.busy) return;
    const em = normEmail($('#a_email').value), pw = $('#a_pw').value;
    if (!em) return toast('اكتب إيميل صحيح (مثال name@gmail.com)');
    if (!pw) return toast('اكتب كلمة السر');
    if (!fbAuth) return toast(auth.fail || 'جاري الاتصال... حاول بعد ثواني');
    busy(true);
    try { await fbAuth.signInWithEmailAndPassword(em, pw); } catch (e) { toast(authErr(e)); }
    busy(false);
  },
  async forgot() {
    if (auth.busy) return;
    const em = normEmail($('#a_email').value);
    if (!em) return toast('اكتب إيميلك في خانة الإيميل أول، ثم اضغط «نسيت كلمة السر؟»');
    if (!fbAuth) return toast(auth.fail || 'جاري الاتصال... حاول بعد ثواني');
    busy(true);
    try {
      try { fbAuth.languageCode = 'ar'; } catch (e) {}
      await fbAuth.sendPasswordResetEmail(em);
      toast('لو الإيميل مسجّل، وصلته رسالة لتغيير كلمة السر. شوف البريد (وجرّب Spam).');
    } catch (e) {
      if (e && e.code === 'auth/user-not-found') toast('لو الإيميل مسجّل، وصلته رسالة لتغيير كلمة السر. شوف البريد (وجرّب Spam).');
      else toast(authErr(e));
    }
    busy(false);
  },
  async adminlogin() {
    if (auth.busy) return;
    const pw = $('#ad_pw').value;
    if (!pw) return toast('اكتب كلمة السر');
    if (!fbAuth) return toast(auth.fail || 'جاري الاتصال... حاول بعد ثواني');
    busy(true);
    try { await fbAuth.signInWithEmailAndPassword(ADMIN_EMAIL, pw); } catch (e) { toast(authErr(e)); }
    busy(false);
  },
  async signup(role) {
    if (auth.busy) return;
    const name = $('#a_name').value.trim(), em = normEmail($('#a_email').value), pw = $('#a_pw').value, cat = $('#reg_cat') ? $('#reg_cat').value : 'shops', phone = $('#a_phone') ? $('#a_phone').value : '';
    if (!name) return toast(role === 'merchant' ? 'اكتب اسم المحل' : 'اكتب اسمك');
    if (!normPhone(phone)) return toast('اكتب رقم ليبيانا صحيح (يبدأ بـ 092 أو 094، مثال 0921234567)');
    if (!em) return toast('اكتب إيميل صحيح (مثال name@gmail.com)');
    if (pw.length < 6) return toast('كلمة السر قصيرة (6 أحرف على الأقل)');
    if (!fbAuth || !fbdb) return toast(auth.fail || 'جاري الاتصال... حاول بعد ثواني');
    busy(true); auth.creating = true;
    let cred = null;
    try {
      cred = await fbAuth.createUserWithEmailAndPassword(em, pw);
      const ref = fbdb.collection('cashback').doc('state'), uref = fbdb.collection('users').doc(cred.user.uid);
      const out = await fbdb.runTransaction(async tx => {
        const d = await tx.get(ref), cur = d.exists ? d.data() : { json: null, rev: 0 };
        const prev = S; let ent, json;
        S = cur.json ? JSON.parse(cur.json) : initial(); norm();
        try { ent = role === 'customer' ? L.addCustomer(name, phone) : L.addMerchant(name, cat, phone); json = stripS(); } finally { S = prev; }
        tx.set(ref, { json, rev: cur.rev + 1, t: Date.now() });
        tx.set(uref, { role, eid: ent.id, name });
        return { json, rev: cur.rev + 1 };
      });
      adopt(out.json, out.rev);
      auth.creating = false;
      await afterLogin(cred.user);
      toast(role === 'merchant' ? 'تم التسجيل. حسابك بانتظار موافقة المدير.' : 'تم إنشاء حسابك');
    } catch (e) {
      auth.creating = false;
      if (cred && cred.user) { try { await cred.user.delete(); } catch (x) { try { await fbAuth.signOut(); } catch (y) {} } }
      toast(authErr(e));
    }
    auth.creating = false; busy(false);
  },
  topup() { if (run(() => L.requestTopup(ui.actor, $('#tp').value, $('#tp_ref').value))) toast('انرسل الطلب للمدير'); },
  mbank() { if (run(() => L.setMerchantCat(ui.actor, $('#mb_cat').value))) toast('انحفظ'); },
  savefmt(v) { if (run(() => L.setBarcodeFormat(v, $('#bp_' + v).value, $('#bl_' + v).value))) toast('انحفظت الشروط'); },
  togglem(v) { run(() => L.setMerchantStatus(v)); },
  gophoto() { ui.tab = 'claim'; render(); },
  claimfor(v) { ui.claimMid = v; ui.tab = 'claim'; render(); },
  cat(v) { ui.cat = v; ui.tab = 'stores'; render(); },
  chip(v) { ui.cat = v; render(); },
  sendclaim() {
    const o = { mid: $('#c_mid').value, no: $('#c_no').value, date: $('#c_date').value, time: $('#c_time').value, barcode: $('#c_bar').value, amount: $('#c_amt').value, photo: ui.claimPhoto };
    const cl = run(() => L.submitClaim(ui.actor, o));
    if (cl && cl.id) { ui.claimPhoto = null; render(); toast(cl.status === 'approved' ? `تم! كاش باك ${fmt(cl.cashback)} دخل محفظتك` : 'انرسل الطلب لمراجعة المدير'); }
  },
  okclaim(v) { const tx = run(() => L.reviewClaim(v, true)); if (tx && tx.method) toast(`تم اعتماد الفاتورة. كاش باك ${fmt(tx.cashback)}`); },
  noclaim(v) { run(() => L.reviewClaim(v, false)); },
  approve(v) { run(() => L.approveTopup(v)); },
  reject(v) { run(() => L.rejectTopup(v)); },
  addbank() {
    const key = $('#b_key').value.trim();
    const b = run(() => L.addBank({ name: $('#b_name').value, holder: $('#b_holder').value, number: $('#b_num').value, kind: $('#b_kind').value, hasKey: !!key }));
    if (b && b.id && key) { try { localStorage.setItem('cb_key_' + b.id, key); } catch (e) { toast('تعذر حفظ المفتاح على هذا الجهاز'); } render(); }
  },
  linkbank(v) { if (run(() => L.linkBank(v))) toast('تم الربط (تجريبي). الاتصال الفعلي بالبنك يحتاج خادم.'); },
  delbank(v) { run(() => L.removeBank(v)); try { localStorage.removeItem('cb_key_' + v); } catch (e) {} },
  rates() { if (run(() => { L.setRates($('#r_c').value, $('#r_k').value); L.setClaimHours($('#r_h').value); L.setAutoApprove($('#r_a').value === '1'); L.setLimits($('#r_mx').value, $('#r_md').value); })) toast('انحفظت الإعدادات'); },
  syncinfo() { toast(sync.msg); },
  askreset() { ui.confirmReset = true; render(); },
  cancelreset() { ui.confirmReset = false; render(); },
  doreset() { S = initial(); ui.confirmReset = false; save(); render(); toast('تم المسح'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el.dataset.v); });
async function readClaimPhoto(file, inputEl) {
  toast('جاري قراءة الصورة...');
  const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  let img = null, url = '';
  try { url = URL.createObjectURL(file); img = await load(url); }
  catch (e) {
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
      img = await load(data);
    } catch (e2) { if (inputEl) inputEl.value = ''; return toast('تعذر فتح هذي الصورة. جرّب صورة ثانية أو التقط صورة جديدة.'); }
  }
  const draw = max => {
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv;
  };
  ui.claimPhoto = draw(560).toDataURL('image/jpeg', 0.55);
  const si = $('#shotimg'); if (si) { si.src = ui.claimPhoto; si.hidden = false; }
  let found = '';
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector().detect(draw(1280)); if (r.length) found = r[0].rawValue; } catch (e) {}
  }
  if (url) URL.revokeObjectURL(url);
  if (inputEl) inputEl.value = '';
  const bar = $('#c_bar');
  if (found && bar) { bar.value = found; toast('قرأت الباركود، راجع الرقم'); }
  else toast('انحفظت الصورة. اكتب رقم الباركود بإيدك');
}
document.addEventListener('change', e => {
  if ((e.target.id === 'shot' || e.target.id === 'shot2') && e.target.files && e.target.files[0]) { readClaimPhoto(e.target.files[0], e.target); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'code') $('#prev').innerHTML = previewHtml(e.target.value.trim());
  if (e.target.id === 'tp') updNet();
  if (e.target.id === 'q') { ui.q = e.target.value; const r = $('#res'); if (r) r.innerHTML = resultsHtml(); }
});
document.addEventListener('focusout', () => { if (deferRender) setTimeout(() => { const a = document.activeElement; if (deferRender && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) { deferRender = false; render(); } }, 250); });
window.addEventListener('hashchange', () => { auth.fail = ''; render(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ad_pw') A.adminlogin();
  else if (e.target.id === 'a_pw' && auth.mode === 'login') A.login();
});
render();
fbInit();
</script>
