<html lang="ar" dir="rtl">
<head>

<title>CASH BACK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow column, dark-brown header band, bottom tab bar per role. Warm cream ground, white cards, orange-red actions, gold accents. Single committed light look. */
:root{
  --bg:#faf3ec; --surface:#ffffff; --ink:#1d1310; --mute:#7b6a61; --line:#eadfd5;
  --brand:#d83a0c; --on-brand:#ffffff; --soft:#fdeadd;
  --head:#3b1c11; --gold:#f9b93a;
  --blue:#f9b93a; --on-blue:#2a1405; --danger:#b3261e;
  --warn-bg:#fff1d6; --warn:#7a4a00;
  --offer-a:#f26100; --offer-b:#3f1d11;
  --font:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-block:0 88px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;min-width:0}
button,input,select{font-family:inherit;font-size:1rem}
.hdr{background:var(--head);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-radius:10px}
.hdr b{display:block;font-weight:800;font-size:1.15rem;letter-spacing:.02em;color:var(--gold)}
.hdr small{opacity:.8}
.sy{background:none;border:0;color:#fff;font:inherit;font-size:.75rem;opacity:.9;margin-inline-start:10px;padding:2px 4px;cursor:pointer}
.sy::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;background:#a89a90}
.sy.on::before{background:#4ade80}
.sy.err::before{background:#ff6b5a}
.ver{display:inline-block;font-size:.7rem;font-weight:800;border:1px solid currentColor;border-radius:99px;padding:0 8px;margin-inline-start:8px;vertical-align:middle;letter-spacing:.04em}
.ver-line{text-align:center;color:var(--blue);font-weight:600;font-size:.9rem;margin:-14px 0 20px}
.link{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px}
main{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card.hero{background:linear-gradient(135deg,var(--offer-a),var(--offer-b));color:#fff;border-color:transparent}
.card.hero .k{color:inherit;opacity:.8}
h2{font-size:1.05rem;margin:0 0 6px;font-weight:800;text-wrap:balance}
h3{font-size:.95rem;margin:6px 0 0;font-weight:800}
.k{color:var(--mute);font-size:.88rem}
.big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.line>span{color:var(--mute)}
.line.b>b,.line.b>span{color:var(--ink);font-weight:800}
.line.pos>b{color:var(--brand)}
.err{color:var(--danger);margin:6px 0 0;font-size:.92rem}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;background:var(--brand);color:var(--on-brand);font-weight:800;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--blue);color:var(--on-blue)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.tabs button:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pair{display:flex;gap:8px}.pair>*{flex:1}
label{display:block;margin-top:10px;color:var(--mute);font-size:.88rem}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:13px 4px;color:var(--mute);font-weight:600;cursor:pointer}
.tabs button.on{color:var(--brand);border-top-color:var(--brand);font-weight:800}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.off{background:var(--warn-bg);color:var(--warn)}
.home{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:4px}
.logo{font-size:2.4rem;font-weight:800;text-align:center;color:var(--brand);letter-spacing:.03em}
.tag{text-align:center;color:var(--mute);margin-bottom:22px}
.pick{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-weight:600;color:var(--ink);cursor:pointer}
.mono{direction:ltr;unicode-bidi:plaintext;display:inline-block}
.seg{display:flex;gap:6px;margin:6px 0 12px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--mute);font-weight:700;cursor:pointer}.seg button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sub{color:var(--mute);font-size:.85rem;margin-top:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cphoto{display:block;width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;margin-bottom:8px}
[hidden]{display:none!important}
.card.cv{color:#fff;border:0;background-size:cover;background-position:center}.card.cv .k,.card.cv .line>span,.card.cv .line.b>span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}.card.cv .line.b>span{font-size:1.1rem}.card.cv .btn.ghost{background:rgba(255,255,255,.93);color:#3b1c11;border-color:transparent}.cvthumb{width:100%;height:110px;object-fit:cover;border-radius:10px;margin:6px 0}
.filebtn{position:relative;overflow:hidden;cursor:pointer;font-size:1rem;text-align:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.search input{border-radius:99px;padding:12px 18px;background:var(--surface);margin:0}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.offer{flex:0 0 86%;min-width:0;scroll-snap-align:start;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--offer-a),var(--offer-b));border:1px solid var(--line)}
.offer,.offer h2{color:#fff}
.offer .k{color:rgba(255,255,255,.82)}
.offer h2{font-size:1.15rem;margin:2px 0}
.offer p{margin:0}
.obtn{background:var(--blue);color:var(--on-blue);border:0;border-radius:99px;padding:8px 20px;font-weight:800;margin-top:12px;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cat{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;cursor:pointer;min-width:0;padding:0}
.cat i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.tabs{align-items:flex-end}
.fab{flex:0 0 78px;position:relative}
.tabs .fab button{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:4px solid var(--bg);background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;padding:0;flex:none}
#shotimg{display:block;max-width:100%;max-height:220px;border-radius:8px;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:30;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ===== تصميم جديد (حسب الملف المرسل): هيدر برتقالي، بحث غائر، بانر كبير، أيقونات نيومورفيزم، زر كاميرا في النص ===== */
:root{--bg:#fff8ef;--brand:#f45116;--offer-a:#ff7200;--offer-b:#9f3d0b}
.hdr{background:linear-gradient(135deg,#ff6900,#e84b0b);border-radius:0 0 28px 28px;padding:20px 20px;min-height:104px;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(220,70,0,.25);margin-top:0}
.hdr::before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(255,255,255,.06);left:-130px;top:-190px;pointer-events:none}
.hdr>*{position:relative}
.hdr b{font-size:1.35rem;font-weight:900;color:#fff;letter-spacing:1px;white-space:nowrap}
.hdr .ver{color:#ffd166;border-color:#ffcc66;font-size:.8rem;font-weight:600;padding:2px 12px}
.search input{height:60px;border:0;background:#fffdf9;box-shadow:inset 5px 5px 10px #e4d8cd,inset -5px -5px 10px #fff;padding:0 24px;font-size:1.02rem}
.offer{border-radius:25px;padding:24px;min-height:200px;background:linear-gradient(135deg,#ff7200,#9f3d0b);border:0;box-shadow:0 10px 22px rgba(150,60,0,.22);display:flex;flex-direction:column;position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07);left:-130px;bottom:-190px;pointer-events:none}
.offer>*{position:relative}
.offer h2{font-size:1.45rem;font-weight:900;margin:6px 0}
.offer p{font-size:1rem}
.obtn{margin-top:auto;align-self:flex-start;background:#ffb82e;color:#251400;border-radius:35px;padding:14px 28px;font-size:1.05rem;font-weight:900;box-shadow:0 6px 0 #ce8c08,0 10px 18px rgba(0,0,0,.16);transition:.12s}
.obtn:active{transform:translateY(5px);box-shadow:0 2px 0 #ce8c08}
.offer{border-radius:20px;padding:14px 16px;min-height:0;gap:2px}
.offer h2{font-size:1.1rem;margin:2px 0}
.offer p{font-size:.82rem;line-height:1.4}
.offer .k{font-size:.75rem}
.obtn{margin-top:8px;padding:8px 20px;font-size:.9rem;border-radius:25px;box-shadow:0 4px 0 #ce8c08,0 6px 12px rgba(0,0,0,.14)}
.obtn:active{transform:translateY(3px);box-shadow:0 1px 0 #ce8c08}
h3{font-size:1.3rem;font-weight:900;margin:10px 0 4px}
.cats{gap:24px 8px;padding-block:6px}
.cat{font-size:.95rem}
.cat i{width:72px;height:72px;border:0;box-shadow:7px 7px 17px #e5d9cf,-7px -7px 17px #fff;transition:.2s}
.cat:active i{box-shadow:inset 5px 5px 12px #ded3c9,inset -5px -5px 12px #fff;transform:scale(.96)}
.sec .link{color:var(--brand);font-weight:800;text-decoration:none}
.tabs{border-top:0;box-shadow:0 -5px 20px rgba(0,0,0,.08);background:rgba(255,255,255,.97)}
.tabs:has(.fab){min-height:78px}
.tabs button{border-top:0}
.tabs button.on{color:var(--brand);font-weight:900}
.tabs .fab button{width:76px;height:76px;bottom:14px;border:7px solid #fff8ef;background:linear-gradient(145deg,#ff6500,#e74608);box-shadow:0 7px 18px rgba(230,70,0,.35);font-weight:900}

.soc-or{display:flex;align-items:center;gap:10px;margin:16px 0 8px;color:var(--mute);font-size:.85rem}.soc-or:before,.soc-or:after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:flex;justify-content:center;gap:18px;margin:6px 0 14px}.soc button{width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.14),inset 0 -2px 4px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.soc button:active{transform:scale(.94)}
.inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:12px 14px;display:none;gap:10px;align-items:center}
.inst.show{display:flex}.inst img{width:44px;height:44px;border-radius:10px;flex:none}.inst .t{flex:1;min-width:0;font-size:.88rem;line-height:1.45}.inst .t b{display:block;font-size:.95rem}
.inst button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:inherit}
.inst .go{background:linear-gradient(135deg,#ff8a2a,#e8590c);color:#fff}.inst .no{background:transparent;color:var(--mute);padding:9px 6px}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="toast" role="status" aria-live="polite" dir="rtl"></div>
<div id="inst" class="inst" dir="rtl" role="dialog"></div>

<script>
/* ---------- محرك الحسابات (نفس محرك التطبيق، مختبر على مثال الملف) ---------- */
const r2 = x => Math.round(x * 100) / 100;
const uid = p => p + Math.random().toString(36).slice(2, 9);
const find = (arr, id, msg) => { const x = arr.find(a => a.id === id); if (!x) throw new Error(msg); return x; };
const log = (actor, action, detail) => S.audit.unshift({ t: Date.now(), actor, action, detail: String(detail ?? '') });
const cbExp = () => (S.settings.cbpayMin || 10) * 60000;
const cbLive = t => t.status === 'pending' && Date.now() - t.at <= cbExp();

const initial = () => ({
  settings: { commission: 6, cashback: 4, invoiceMinutes: 15, claimHours: 24, autoApprove: true, minTopup: 50, minPayout: 10, refBonus: 1, refMin: 20, cancelMin: 30, minSettle: 20, cbpayMin: 10 }, notes: [], payouts: [],
  platform: 0,
  merchants: [{ id: 'm1', name: 'مطعم الأصيل', cat: 'restaurants', status: 'active', barPrefix: '', barLen: 0, digital: 0, funded: 0, real: 0, bank: 0, bankName: '', bankAccount: '' }],
  customers: [{ id: 'c1', name: 'أحمد', wallet: 0 }],
  topups: [], invoices: [], txns: [], audit: [], banks: [], claims: [], cbpays: [], settles: []
});

const normPhone = p => { let d = String(p || '').replace(/[\u0660-\u0669]/g, x => x.charCodeAt(0) - 1632).replace(/\D/g, ''); if (d.startsWith('00218')) d = '0' + d.slice(5); else if (d.startsWith('218')) d = '0' + d.slice(3); else if (d.length === 9 && d[0] === '9') d = '0' + d; return /^09[24]\d{7}$/.test(d) ? d : ''; };
const MGR_PHONE = '0946563895';
const getRef = () => { try { return localStorage.getItem('cb_ref') || ''; } catch (e) { return ''; } };
try { const q = new URLSearchParams(location.search).get('ref'); if (q && /^[\w-]{3,40}$/.test(q)) localStorage.setItem('cb_ref', q); } catch (e) {}
const notify = (to, text) => { (S.notes = S.notes || []).unshift({ id: uid('n'), to, text, t: Date.now(), read: false }); if (S.notes.length > 300) S.notes.length = 300; };
const meId = () => (auth.profile && auth.profile.role === 'admin') || isAdmin() ? 'admin' : ui.actor;
const unreadCount = id => (S.notes || []).filter(n => n.to === id && !n.read).length;
const hashStr = s => { let x = 5381; for (let i = 0; i < s.length; i += 7) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0) + ':' + s.length; };

const L = {
  addMerchant(name, cat, phone, id) {
    if (!name.trim()) throw new Error('اكتب اسم المحل');
    const ph = normPhone(phone);
    if (!ph) throw new Error('اكتب رقم ليبيانا صحيح (يبدأ بـ 092 أو 094، مثال 0921234567)');
    if (S.merchants.some(x => x.phone === ph)) throw new Error('رقم الهاتف مستخدم لمحل آخر');
    const m = { id: id || uid('m'), name: name.trim(), phone: ph, cat: cat || 'shops', status: 'pending', barPrefix: '', barLen: 0, digital: 0, funded: 0, real: 0, bank: 0, bankName: '', bankAccount: '' };
    S.merchants.push(m); log('system', 'تسجيل تاجر', m.name); notify('admin', 'تاجر جديد بانتظار التفعيل: ' + m.name); return m;
  },
  addCustomer(name, phone, id, refId) {
    if (!name.trim()) throw new Error('اكتب الاسم');
    const ph = normPhone(phone);
    if (!ph) throw new Error('اكتب رقم ليبيانا صحيح (يبدأ بـ 092 أو 094، مثال 0921234567)');
    if (S.customers.some(x => x.phone === ph)) throw new Error('رقم الهاتف مستخدم لحساب آخر');
    const c = { id: id || uid('c'), name: name.trim(), phone: ph, wallet: 0 };
    if (refId && refId !== c.id && S.customers.some(x => x.id === refId)) c.ref = refId;
    S.customers.push(c); log('system', 'تسجيل زبون', c.name); return c;
  },
  setMerchantLoc(mid, lat, lng) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    if (lat === null) { delete m.lat; delete m.lng; log(mid, 'مسح موقع المحل', ''); return; }
    lat = Number(lat); lng = Number(lng);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) throw new Error('الموقع غير صحيح');
    m.lat = Math.round(lat * 1e4) / 1e4; m.lng = Math.round(lng * 1e4) / 1e4; log(mid, 'تحديد موقع المحل', '');
  },
  setMerchantCat(mid, cat) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    if (cat) m.cat = cat;
    log(mid, 'تحديث نوع النشاط', m.cat);
  },
  requestTopup(mid, amount, ref) {
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    const minT = S.settings.minTopup || 0;
    if (amount < minT) throw new Error('أقل مبلغ للشحن ' + minT + ' د.ل');
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    ref = String(ref || '').trim();
    if (ref.length < 4) throw new Error('اكتب رقم عملية التحويل (من رسالة ليبيانا)');
    if (S.topups.some(x => x.status !== 'rejected' && String(x.ref || '').toLowerCase() === ref.toLowerCase())) throw new Error('رقم العملية هذا مستخدم من قبل');
    const t = { id: uid('t'), mid, amount, ref, phone: m.phone || '', status: 'pending', at: Date.now() };
    S.topups.unshift(t); log(mid, 'طلب شحن', amount); notify('admin', `طلب شحن جديد: ${m.name} • ${amount} د.ل (عملية ${ref})`); return t;
  },
  approveTopup(id) {
    const t = find(S.topups, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    const m = find(S.merchants, t.mid, 'تاجر غير موجود');
    m.digital = r2(m.digital + t.amount); m.funded = r2((m.funded || 0) + t.amount);
    t.status = 'approved';
    log('admin', 'موافقة شحن', `${m.name} ${t.amount} (عملية ${t.ref || '-'})`);
    notify(m.id, `تمت الموافقة على شحنك ${t.amount} د.ل. رصيدك الآن ${m.digital} د.ل`);
  },
  rejectTopup(id) {
    const t = find(S.topups, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    t.status = 'rejected'; log('admin', 'رفض شحن', `${t.mid} ${t.amount}`); notify(t.mid, `تم رفض طلب الشحن ${t.amount} د.ل. تواصل مع المدير`);
  },
  requestPayout(cid, amount) {
    const c = find(S.customers, cid, 'زبون غير موجود');
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    const mn = S.settings.minPayout || 0;
    if (amount < mn) throw new Error('أقل مبلغ للتحويل ' + mn + ' د.ل');
    if (amount > c.wallet) throw new Error('رصيدك غير كافٍ');
    if (S.payouts.some(x => x.cid === cid && x.status === 'pending')) throw new Error('عندك طلب تحويل قيد المراجعة، استنى لين يتم');
    c.wallet = r2(c.wallet - amount);
    const t = { id: uid('p'), cid, amount, phone: c.phone || '', status: 'pending', at: Date.now() };
    S.payouts.unshift(t); log(cid, 'طلب تحويل رصيد', amount); notify('admin', `طلب تحويل رصيد: ${c.name} • ${amount} د.ل إلى ${c.phone}`); return t;
  },
  approvePayout(id) {
    const t = find(S.payouts, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    t.status = 'done'; log('admin', 'تحويل رصيد لزبون', `${t.phone} ${t.amount}`); notify(t.cid, `تم تحويل ${t.amount} د.ل رصيد ليبيانا لرقمك ${t.phone}`);
  },
  rejectPayout(id) {
    const t = find(S.payouts, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    const c = find(S.customers, t.cid, 'زبون غير موجود');
    c.wallet = r2(c.wallet + t.amount); t.status = 'rejected'; log('admin', 'رفض تحويل رصيد', `${t.phone} ${t.amount}`); notify(t.cid, `تم رفض طلب التحويل ${t.amount} د.ل ورجع لمحفظتك`);
  },
  // ===== دفع بالكاش باك عند التاجر + تسوية مع الشركة =====
  requestCbPay(cid, mid, amount) {
    const c = find(S.customers, cid, 'زبون غير موجود'), m = find(S.merchants, mid, 'اختر المحل');
    amount = r2(Number(amount));
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    if (m.status !== 'active') throw new Error('هذا المحل غير مفعّل');
    if (amount > c.wallet) throw new Error('رصيدك غير كافٍ');
    if (S.cbpays.some(x => x.cid === cid && cbLive(x))) throw new Error('عندك طلب دفع بانتظار التاجر');
    const t = { id: uid('b'), cid, mid, amount, status: 'pending', at: Date.now() };
    S.cbpays.unshift(t); log(cid, 'طلب دفع بكاش باك', `${m.name} ${amount}`);
    notify(mid, `طلب دفع بكاش باك: ${c.name} • ${amount} د.ل. افتح الرئيسية للقبول`); return t;
  },
  cancelCbPay(id, cid) {
    const t = find(S.cbpays, id, 'الطلب غير موجود');
    if (t.cid !== cid) throw new Error('غير مسموح');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    t.status = 'canceled'; log(cid, 'إلغاء طلب دفع بكاش باك', t.amount);
  },
  reviewCbPay(id, ok, mid) {
    const t = find(S.cbpays, id, 'الطلب غير موجود');
    if (t.mid !== mid) throw new Error('غير مسموح');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    const m = find(S.merchants, t.mid, 'تاجر غير موجود'), c = find(S.customers, t.cid, 'زبون غير موجود');
    if (!ok) { t.status = 'rejected'; log(m.id, 'رفض دفع بكاش باك', t.amount); notify(c.id, `${m.name} رفض طلب الدفع بكاش باك ${t.amount} د.ل`); return; }
    if (!cbLive(t)) throw new Error('انتهت مدة الطلب. اطلب من الزبون يرسل طلب جديد');
    if (c.wallet < t.amount) throw new Error('رصيد الزبون غير كافٍ الآن');
    c.wallet = r2(c.wallet - t.amount); m.cbIn = r2((m.cbIn || 0) + t.amount);
    t.status = 'done'; t.done = Date.now();
    log(m.id, 'قبول دفع بكاش باك', `${c.name} ${t.amount}`);
    notify(c.id, `تم الدفع ${t.amount} د.ل من كاش باك عند ${m.name}. رصيدك ${c.wallet} د.ل`);
    return t;
  },
  setMinSettle(v) {
    v = Number(v);
    if (!(v >= 0)) throw new Error('الحد الأدنى للتسوية غير صحيح');
    S.settings.minSettle = v; log('admin', 'تعديل أقل مبلغ للتسوية', v);
  },
  requestSettle(mid, o) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    if (S.settles.some(x => x.mid === mid && x.status === 'pending')) throw new Error('عندك طلب تسوية قيد المراجعة');
    const items = S.cbpays.filter(x => x.mid === mid && x.status === 'done' && !x.sid);
    const sum = r2(items.reduce((a, x) => a + x.amount, 0));
    const min = S.settings.minSettle || 0;
    if (!items.length || sum <= 0) throw new Error('ما عندك كاش باك مستلم للتسوية');
    if (sum < min) throw new Error('أقل مبلغ للتسوية ' + min + ' د.ل');
    const bank = String(o.bank || '').trim(), acct = String(o.acct || '').trim(), holder = String(o.holder || '').trim();
    if (!bank || acct.length < 6 || !holder) throw new Error('اكتب اسم المصرف ورقم الحساب واسم صاحب الحساب');
    const no = 'S' + String(S.settles.length + 1).padStart(4, '0');
    const t = { id: uid('s'), no, mid, amount: sum, items: items.map(x => x.id), bank, acct, holder, status: 'pending', at: Date.now() };
    items.forEach(x => { x.sid = t.id; });
    m.cbIn = Math.max(0, r2((m.cbIn || 0) - sum));
    m.payBank = bank; m.payAcct = acct; m.payName = holder;
    S.settles.unshift(t); log(mid, 'طلب تسوية', `${no} ${sum}`);
    notify('admin', `طلب تسوية ${no}: ${m.name} • ${sum} د.ل`); return t;
  },
  approveSettle(id, ref) {
    const t = find(S.settles, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    ref = String(ref || '').trim();
    if (ref.length < 4) throw new Error('اكتب رقم/مرجع التحويل البنكي');
    t.status = 'paid'; t.ref = ref; t.paidAt = Date.now();
    log('admin', 'تسوية مدفوعة', `${t.no} ${t.amount} (مرجع ${ref})`);
    notify(t.mid, `تم تحويل ${t.amount} د.ل لحسابك البنكي (تسوية ${t.no}، مرجع ${ref})`);
  },
  rejectSettle(id) {
    const t = find(S.settles, id, 'الطلب غير موجود');
    if (t.status !== 'pending') throw new Error('الطلب تمت معالجته');
    const m = find(S.merchants, t.mid, 'تاجر غير موجود');
    t.status = 'rejected'; m.cbIn = r2((m.cbIn || 0) + t.amount);
    t.items.forEach(i => { const x = S.cbpays.find(y => y.id === i); if (x) x.sid = null; });
    log('admin', 'رفض تسوية', `${t.no} ${t.amount}`);
    notify(t.mid, `تم رفض طلب التسوية ${t.no} ورجع المبلغ ${t.amount} د.ل لرصيد كاش باك المستلم`);
  },
  canDelete(role, eid) {
    if (role === 'customer') {
      const c = find(S.customers, eid, 'الحساب غير موجود');
      if (c.wallet >= 0.01) throw new Error('رصيدك ' + c.wallet + ' د.ل. حوّله لرقم هاتفك أول (المحفظة ← حوّل) ثم احذف');
      if (S.payouts.some(x => x.cid === eid && x.status === 'pending')) throw new Error('عندك طلب تحويل قيد المراجعة، استنى لين يتم');
      if (S.cbpays.some(x => x.cid === eid && cbLive(x))) throw new Error('عندك طلب دفع بكاش باك بانتظار التاجر');
      if (S.claims.some(x => x.cid === eid && x.status === 'pending')) throw new Error('عندك فاتورة قيد المراجعة، استنى لين تنتهي');
    } else {
      const m = find(S.merchants, eid, 'الحساب غير موجود');
      if (m.digital >= 0.01) throw new Error('رصيد محفظتك ' + m.digital + ' د.ل. تواصل مع المدير لتسوية الرصيد قبل الحذف');
      if ((m.cbIn || 0) >= 0.01 || S.settles.some(x => x.mid === eid && x.status === 'pending')) throw new Error('عندك كاش باك مستلم أو تسوية قيد المراجعة. اطلب التسوية واستلمها قبل الحذف');
      if (S.topups.some(x => x.mid === eid && x.status === 'pending')) throw new Error('عندك طلب شحن قيد المراجعة');
      if (S.claims.some(x => x.mid === eid && x.status === 'pending')) throw new Error('فيه فواتير زبائن قيد المراجعة على محلك');
    }
  },
  deleteAccount(role, eid) {
    L.canDelete(role, eid);
    if (role === 'customer') {
      S.customers = S.customers.filter(x => x.id !== eid);
      S.claims = S.claims.filter(x => x.cid !== eid);
      S.payouts = S.payouts.filter(x => x.cid !== eid);
    } else {
      S.merchants = S.merchants.filter(x => x.id !== eid);
      S.topups = S.topups.filter(x => x.mid !== eid);
    }
    S.notes = (S.notes || []).filter(n => n.to !== eid);
    log('system', 'حذف حساب', role === 'customer' ? 'زبون' : 'تاجر');
  },
  createInvoice(mid, amount) {
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    find(S.merchants, mid, 'تاجر غير موجود');
    let code; do { code = String(Math.floor(100000 + Math.random() * 900000)); } while (S.invoices.some(i => i.code === code));
    const inv = { id: uid('inv'), code, mid, amount, exp: Date.now() + S.settings.invoiceMinutes * 60000, used: false };
    S.invoices.unshift(inv); log(mid, 'إنشاء فاتورة', `${code} / ${amount}`); return inv;
  },
  // طلب كاش باك بفاتورة مصورة. منع التكرار: نفس المحل + نفس رقم الفاتورة، أو نفس المحل + نفس الباركود.
  submitClaim(cid, o) {
    const c = find(S.customers, cid, 'زبون غير موجود');
    const m = find(S.merchants, o.mid, 'اختر محل من القائمة. الكاش باك فقط من المحلات المسجلة في التطبيق.');
    if (m.status !== 'active') throw new Error('هذا المحل مش مفعّل في التطبيق. الكاش باك فقط من المحلات المسجلة والمفعّلة.');
    const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
    const no = String(o.no || '').trim(), bar = String(o.barcode || '').trim(), amount = Number(o.amount);
    if (!no) throw new Error('اكتب رقم الفاتورة');
    if (!o.date || !o.time) throw new Error('اكتب تاريخ الفاتورة وساعتها');
    if (!bar) throw new Error('اكتب رقم الباركود المطبوع تحت الخطوط');
    if (!(amount > 0)) throw new Error('المبلغ غير صحيح');
    if (!o.photo) throw new Error('صوّر الفاتورة أولاً');
    const bp = (m.barPrefix || '').toLowerCase(), bl = Number(m.barLen) || 0;
    if ((bp && !bar.toLowerCase().startsWith(bp)) || (bl && bar.length !== bl)) throw new Error('الباركود ما يطابق فواتير هذا المحل. تأكد إنك اخترت المحل الصحيح.');
    const at = new Date(o.date + 'T' + o.time).getTime();
    if (isNaN(at)) throw new Error('التاريخ أو الساعة غير صحيحة');
    if (at > Date.now() + 5 * 60000) throw new Error('تاريخ الفاتورة في المستقبل');
    const hours = S.settings.claimHours || 24;
    if (Date.now() - at > hours * 3600000) throw new Error(`انتهت مدة المطالبة (${hours} ساعة من وقت الفاتورة)`);
    if (S.claims.some(x => x.mid === m.id && x.status !== 'rejected' && (norm(x.no) === norm(no) || norm(x.barcode) === norm(bar)))) throw new Error('هذي الفاتورة مسجلة من قبل');
    const ph = hashStr(o.photo);
    if (S.claims.some(x => x.status !== 'rejected' && x.ph === ph)) throw new Error('هذي الصورة مستخدمة في فاتورة سابقة');
    const maxDaily = S.settings.maxDaily || 5, maxInv = S.settings.maxInvoice || 2000;
    if (S.claims.filter(x => x.cid === c.id && x.status !== 'rejected' && x.created > Date.now() - 86400000).length >= maxDaily) throw new Error(`وصلت للحد اليومي (${maxDaily} فواتير في 24 ساعة)`);
    const cl = { id: uid('cl'), mid: m.id, cid: c.id, no, barcode: bar, date: o.date, time: o.time, at, amount, photo: o.photo, ph, status: 'pending', created: Date.now() };
    let review = '';
    if (!(bp || bl)) review = 'لم تُضبط شروط الباركود لهذا المحل';
    else if (amount > maxInv) review = `المبلغ أكبر من ${maxInv} د.ل`;
    else if (S.settings.autoApprove === false) review = 'اعتماد المدير مفعّل';
    if (review) { cl.review = review; notify('admin', `فاتورة بانتظار المراجعة: ${c.name} • ${m.name} • ${amount} د.ل`); notify(c.id, `فاتورتك من ${m.name} قيد المراجعة`); } else L.settleClaim(cl);
    S.claims.unshift(cl); log(c.id, 'طلب كاش باك بفاتورة', `${m.name} #${no} / ${amount}`); return cl;
  },
  // إلغاء عملية خاطئة: يسمح للتاجر خلال مدة قصيرة، ويرجع كل شيء كما كان
  cancelTx(mid, id) {
    const i = S.txns.findIndex(x => x.id === id && x.mid === mid); if (i < 0) throw new Error('العملية غير موجودة');
    const tx = S.txns[i], lim = S.settings.cancelMin || 0;
    if (Date.now() - tx.t > lim * 60000) throw new Error('انتهت مدة الإلغاء (' + lim + ' دقيقة). تواصل مع المدير');
    const m = find(S.merchants, mid, 'تاجر غير موجود'), c = S.customers.find(x => x.id === tx.cid);
    if (!c) throw new Error('حساب الزبون محذوف. تواصل مع المدير');
    const b = tx.refb || 0, inv = b ? S.customers.find(x => x.id === c.ref) : null;
    if (tx.method === 'wallet') {
      if (m.digital < tx.amount) throw new Error('رصيد محفظتك أقل من مبلغ العملية');
      m.digital = r2(m.digital - tx.amount); c.wallet = r2(c.wallet + tx.amount);
    } else {
      const mg = r2(tx.fee - tx.cashback);
      if (c.wallet < tx.cashback + b) throw new Error('الزبون صرف جزء من الكاش باك. تواصل مع المدير');
      if (inv && inv.wallet < b) throw new Error('مكافأة الدعوة انصرفت. تواصل مع المدير');
      if (S.platform < mg + b * 2) throw new Error('تعذر الإلغاء الآن. تواصل مع المدير');
      m.digital = r2(m.digital + tx.fee); S.platform = r2(S.platform - mg); c.wallet = r2(c.wallet - tx.cashback);
      if (b) { c.wallet = r2(c.wallet - b); if (inv) { inv.wallet = r2(inv.wallet - b); inv.refEarn = r2(Math.max(0, (inv.refEarn || 0) - b)); } S.platform = r2(S.platform + b * 2); c.refPaid = false; }
    }
    if (tx.cl) { const cl = S.claims.find(x => x.id === tx.cl); if (cl) { cl.status = 'cancelled'; cl.cashback = 0; } }
    S.txns.splice(i, 1);
    notify(c.id, `تم إلغاء عملية ${tx.amount} د.ل من ${m.name} وتم عكس الكاش باك`); notify('admin', `إلغاء عملية: ${m.name} • ${tx.amount} د.ل`);
    log(mid, 'إلغاء عملية', `${c.name} ${tx.amount}`);
  },
  // مكافأة الدعوة: أول عملية للمدعو (بحد أدنى) تعطي كل من الداعي والمدعو مكافأة من محفظة المدير
  refReward(c, amount) {
    const b = S.settings.refBonus || 0;
    if (!b || !c.ref || c.refPaid || amount < (S.settings.refMin || 0)) return 0;
    const inv = S.customers.find(x => x.id === c.ref);
    if (!inv || S.platform < b * 2) return 0;
    c.refPaid = true; S.platform = r2(S.platform - b * 2);
    inv.wallet = r2(inv.wallet + b); c.wallet = r2(c.wallet + b); inv.refEarn = r2((inv.refEarn || 0) + b);
    notify(inv.id, `صاحبك ${c.name} اشترى أول مرة. نزلت لك مكافأة دعوة ${b} د.ل`); notify(c.id, `مكافأة دعوة ${b} د.ل نزلت في رصيدك`);
    log('system', 'مكافأة دعوة', `${inv.name} ← ${c.name} ${b}`); return b;
  },
  // اعتماد الفاتورة: ينقص رقمي المحل بقيمة الفاتورة، والكاش باك من محفظة CASH BACK إلى محفظة الزبون
  settleClaim(cl) {
    const m = find(S.merchants, cl.mid, 'تاجر غير موجود'), c = find(S.customers, cl.cid, 'زبون غير موجود');
    const fee = r2(cl.amount * S.settings.commission / 100), cb = r2(cl.amount * S.settings.cashback / 100), mg = r2(fee - cb);
    if (m.digital < fee) throw new Error('رصيد المحل غير كافٍ لدفع العمولة، لازم يشحن محفظته');
    const was = m.digital;
    m.digital = r2(m.digital - fee); S.platform = r2(S.platform + mg); c.wallet = r2(c.wallet + cb);
    cl.status = 'approved'; cl.cashback = cb;
    notify(c.id, `نزل في رصيدك كاش باك ${cb} د.ل من ${m.name}`); notify(m.id, `عملية جديدة ${cl.amount} د.ل (عمولة ${fee} د.ل)`);
    if (was > 20 && m.digital <= 20) notify(m.id, 'رصيدك قارب على الانتهاء، اشحن محفظتك');
    const tx = { id: uid('x'), t: Date.now(), mid: m.id, cid: c.id, amount: cl.amount, cashback: cb, fee, method: 'claim' };
    tx.cl = cl.id; S.txns.unshift(tx); tx.refb = L.refReward(c, cl.amount); log('system', 'كاش باك بفاتورة', `${m.name} #${cl.no} / ${cl.amount} كاش باك ${cb}`); return tx;
  },
  reviewClaim(id, ok) {
    const cl = find(S.claims, id, 'الطلب غير موجود');
    if (cl.status !== 'pending') throw new Error('الطلب تمت معالجته');
    if (ok) { const tx = L.settleClaim(cl); log('admin', 'اعتماد فاتورة', `${cl.no} / ${cl.amount}`); return tx; }
    cl.status = 'rejected'; log('admin', 'رفض فاتورة', `${cl.no} / ${cl.amount}`); notify(cl.cid, `تم رفض فاتورتك رقم ${cl.no}`); return true;
  },
  setAutoApprove(on) { S.settings.autoApprove = !!on; log('admin', 'اعتماد الفواتير', on ? 'تلقائي' : 'مراجعة المدير'); },
  setBarcodeFormat(mid, prefix, len) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    prefix = String(prefix || '').trim(); len = String(len || '').trim();
    if (prefix && !/^[A-Za-z0-9-]{1,12}$/.test(prefix)) throw new Error('البادئة حروف وأرقام فقط (حتى 12)');
    if (len && !/^\d{1,20}$/.test(len)) throw new Error('الطول لازم يكون رقم');
    m.barPrefix = prefix; m.barLen = len ? Number(len) : 0;
    log('admin', 'شروط باركود المحل', `${m.name}: ${prefix || '-'} / ${m.barLen || '-'}`);
  },
  setMerchantStatus(mid) {
    const m = find(S.merchants, mid, 'تاجر غير موجود');
    m.status = m.status === 'active' ? 'suspended' : 'active';
    notify(m.id, m.status === 'active' ? 'تم تفعيل حسابك، تقدر تستقبل الزبائن' : 'تم إيقاف حسابك، تواصل مع المدير');
    log('admin', m.status === 'active' ? 'تفعيل محل' : 'إيقاف محل', m.name);
  },
  setLimits(maxInvoice, maxDaily) {
    maxInvoice = Number(maxInvoice); maxDaily = Number(maxDaily);
    if (!(maxInvoice > 0) || !(maxDaily >= 1)) throw new Error('الحدود غير صحيحة');
    S.settings.maxInvoice = maxInvoice; S.settings.maxDaily = Math.floor(maxDaily);
    log('admin', 'تعديل الحدود', `${maxInvoice} د.ل / ${S.settings.maxDaily} فواتير`);
  },
  setClaimHours(hh) {
    hh = Number(hh);
    if (!(hh > 0 && hh <= 720)) throw new Error('مدة المطالبة لازم تكون بين 1 و720 ساعة');
    S.settings.claimHours = hh; log('admin', 'تعديل مدة المطالبة', hh + ' ساعة');
  },
  checkInvoice(code) {
    const inv = S.invoices.find(i => i.code === code);
    if (!inv) throw new Error('كود الفاتورة غير صحيح');
    if (inv.used) throw new Error('الفاتورة مدفوعة من قبل');
    if (Date.now() > inv.exp) throw new Error('انتهت صلاحية الفاتورة');

const hasLoc = m => typeof m.lat === 'number' && typeof m.lng === 'number';
function distKm(a, b, c, d) {

function reportBody(m, sales) {
  const day0 = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const today = day0(Date.now()), DAY = 864e5, days = ui.rp === 'all' ? 0 : Number(ui.rp);
  const from = ui.rp === 'all' ? 0 : today - (days - 1) * DAY;
  const L1 = sales.filter(t => t.t >= from);
  const tot = L1.reduce((a, t) => a + t.amount, 0), cb = L1.reduce((a, t) => a + (t.cashback || 0), 0);
  const fees = L1.reduce((a, t) => a + (t.fee != null ? t.fee : (t.method === 'wallet' ? 0 : t.amount * S.settings.commission / 100)), 0);
  const cust = {}; L1.forEach(t => { const o = cust[t.cid] || (cust[t.cid] = { n: 0, s: 0, last: 0 }); o.n++; o.s += t.amount; o.last = Math.max(o.last, t.t); });
  const ids = Object.keys(cust), firstSeen = {}; sales.forEach(t => { firstSeen[t.cid] = Math.min(firstSeen[t.cid] || Infinity, t.t); });
  const fresh = ids.filter(id => firstSeen[id] >= from).length, back = ids.length - fresh;
  // رسم آخر 7 أيام
  const bars = []; for (let i = 6; i >= 0; i--) { const a = today - i * DAY; bars.push({ d: new Date(a), v: sales.filter(t => t.t >= a && t.t < a + DAY).reduce((x, t) => x + t.amount, 0) }); }
  const mx = Math.max(1, ...bars.map(b => b.v)), names = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const chart = `<div class="card"><h2>مبيعات آخر 7 أيام</h2><div style="display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px">${bars.map(b => `<div style="flex:1;text-align:center;font-size:.7rem"><div style="height:${Math.round(b.v / mx * 90)}px;min-height:${b.v ? 3 : 0}px;background:linear-gradient(#ff6500,#e74608);border-radius:6px 6px 0 0"></div><div style="margin-top:4px;color:var(--mute)">${names[b.d.getDay()]}</div></div>`).join('')}</div>
    <div class="k" style="margin-top:6px">أعلى يوم: ${fmt(mx === 1 && !bars.some(b => b.v) ? 0 : mx)}</div></div>`;
  const top = ids.sort((a, b) => cust[b].s - cust[a].s).slice(0, 5);
  const rows = top.map((id, i) => { const c = S.customers.find(x => x.id === id); return `<div class="card" style="padding:12px">${line((i + 1) + '. ' + esc(c ? c.name : 'زبون'), fmt(cust[id].s), 'b')}<div class="k">${cust[id].n} عملية • آخر زيارة ${new Date(cust[id].last).toLocaleDateString('ar-LY')}</div></div>`; }).join('');
  const chip = ([k, n]) => `<button class="chip ${ui.rp === k ? 'on' : ''}" data-act="rp" data-v="${k}">${n}</button>`;
  return `<div class="chips">${[['1', 'اليوم'], ['7', '7 أيام'], ['30', '30 يوم'], ['all', 'الكل']].map(chip).join('')}</div>
    <div class="card"><h2>ملخص الفترة</h2>${line('المبيعات', fmt(tot), 'b')}${line('عدد العمليات', L1.length)}${line('متوسط العملية', fmt(L1.length ? tot / L1.length : 0))}${line('كاش باك للزبائن', fmt(cb))}${line('عمولات مدفوعة', fmt(fees))}</div>
    <div class="card"><h2>الزبائن</h2>${line('عدد الزبائن', ids.length)}${line('زبائن جدد', fresh)}${line('زبائن راجعين', back)}</div>
    ${chart}<h3>أفضل زبائنك</h3>${rows || '<p class="k">ما فيش عمليات في هذه الفترة.</p>'}`;
}

    <h3>سجل التسويات</h3>
    ${S.settles.filter(x => x.mid === m.id && x.status !== 'pending').map(t => `<div class="card">${line('#' + esc(t.no) + ' • ' + settleStatus(t.status), fmt(t.amount), 'b')}${t.ref ? line('مرجع التحويل', '<span class="mono">' + esc(t.ref) + '</span>') : ''}<button class="btn ghost" style="margin-top:8px" data-act="shareset" data-v="${t.id}">مشاركة الكشف</button></div>`).join('') || '<p class="k">ما فيش تسويات سابقة.</p>'}`;

function merchant() {
  const m = find(S.merchants, ui.actor, 'x');
  const sales = S.txns.filter(t => t.mid === m.id);
  const total = sales.reduce((a, t) => a + t.amount, 0), cbp = sales.reduce((a, t) => a + t.cashback, 0);
  let body;
  if (ui.tab === 'home') {
    const funded = Math.max(m.funded || 0, m.digital), pct = funded ? Math.max(0, Math.min(100, m.digital / funded * 100)) : 0;
    const feesPaid = sales.reduce((a, t) => a + (t.fee != null ? t.fee : (t.method === 'wallet' ? 0 : t.amount * S.settings.commission / 100)), 0);
    body = `${m.status === 'active' ? '' : `<div class="note">${m.status === 'pending' ? 'حسابك بانتظار موافقة المدير. ما يظهر للزبائن لين يتفعل.' : 'حسابك موقوف. تواصل مع المدير.'}</div>`}<div class="card"><h2>رصيد محفظتك</h2><div class="big">${fmt(m.digital)}</div>

      ${S.cbpays.filter(x => x.mid === m.id && cbLive(x)).map(x => { const c = S.customers.find(y => y.id === x.cid); return `<div class="card" style="border:2px solid #f45116"><h2>طلب دفع بكاش باك</h2>${line(esc(c && c.name), fmt(x.amount), 'b')}<p class="k">سلّم الزبون بضاعة بقيمة ${fmt(x.amount)} ثم اضغط قبول.</p><div class="pair"><button class="btn" data-act="cbok" data-v="${x.id}">قبول</button><button class="btn danger" data-act="cbno" data-v="${x.id}">رفض</button></div></div>`; }).join('')}
      <div class="card">${line('كاش باك مستلم من الزبائن', fmt(m.cbIn || 0), 'b')}<p class="k">رصيد منفصل تطلب تسويته من الشركة.</p><button class="btn alt" data-act="tab" data-v="settle">طلب تسوية</button></div>
      <div class="card">${line('عمولات مدفوعة', fmt(feesPaid), 'b')}${line('إجمالي المبيعات', fmt(total))}${line('كاش باك للزبائن', fmt(cbp))}${line('عدد العمليات', sales.length)}</div>
      <h3>سجل العمليات</h3>

function render() {
  S.merchants.forEach(m => { if (!CATS.some(c => c[0] === m.cat)) m.cat = 'shops'; });
  const app = $('#app');
  const route = location.hash === '#admin' ? 'admin' : 'main';
  const role = auth.profile && auth.profile.role;
  let html;
  if (!auth.ready) html = loadingHtml('جاري التحميل...');
  else if (route === 'admin') {
    if (!isAdmin()) html = adminLogin();
    else { if (!['overview', 'merchants', 'requests', 'settings', 'notes'].includes(ui.tab)) ui.tab = 'overview'; html = admin(); }
  }
  else if (!auth.user) html = authHtml();
  else if (auth.user && !auth.profile && auth.pend) html = completeHtml();
  else if (!auth.profile) html = loadingHtml(auth.profileErr || 'جاري تحميل حسابك...', true);
  else if (role === 'admin') html = authHtml();
  else if (role === 'customer' && S.customers.some(c => c.id === ui.actor)) { if (!['home', 'stores', 'wallet', 'me', 'claim', 'notes'].includes(ui.tab)) ui.tab = 'home'; html = customer(); }
  else if (role === 'merchant' && S.merchants.some(m => m.id === ui.actor)) { if (!['home', 'report', 'topup', 'settle', 'bank', 'notes'].includes(ui.tab)) ui.tab = 'home'; html = merchant(); }
  else if (stateLoaded && (role === 'customer' || role === 'merchant')) html = repairHtml(role);
  else html = loadingHtml('جاري مزامنة حسابك...', true);
  app.innerHTML = html;
  const tp = $('#tp'); if (tp) updNet();
  fetchPhotos(); fetchCovers();
}

async function readClaimPhoto(file, inputEl) {
  toast('جاري قراءة الصورة...');
  const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  let img = null, url = '';
  try { url = URL.createObjectURL(file); img = await load(url); }
  catch (e) {
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
      img = await load(data);
    } catch (e2) { if (inputEl) inputEl.value = ''; return toast('تعذر فتح هذي الصورة. جرّب صورة ثانية أو التقط صورة جديدة.'); }
  }
  const draw = max => {
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return cv;
  };
  ui.claimPhoto = draw(560).toDataURL('image/jpeg', 0.55);
  const si = $('#shotimg'); if (si) { si.src = ui.claimPhoto; si.hidden = false; }
  let found = '';
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector().detect(draw(1280)); if (r.length) found = r[0].rawValue; } catch (e) {}
  }
  if (url) URL.revokeObjectURL(url);
  if (inputEl) inputEl.value = '';
  const bar = $('#c_bar');
  if (found && bar) { bar.value = found; toast('قرأت الباركود، راجع الرقم'); }
  else toast('انحفظت الصورة. اكتب رقم الباركود بإيدك');
}
async function readCover(file, mid, inputEl) {
  toast('جاري قراءة الصورة...');
  const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  let img = null;
  try { const url = URL.createObjectURL(file); img = await load(url); URL.revokeObjectURL(url); }
  catch (e) { if (inputEl) inputEl.value = ''; return toast('تعذر فتح هذي الصورة. جرّب صورة ثانية.'); }
  const W = 640, H = 320, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const k = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
  cv.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  const data = cv.toDataURL('image/jpeg', 0.6);
  if (inputEl) inputEl.value = '';
  if (!fdb) return toast('لا يوجد اتصال، حاول بعد ثواني');
  try { await fdb.collection('photos').doc('cover_' + mid).set({ data }); }
  catch (e) { return toast(fbErr(e)); }
  coverCache[mid] = data; coverReq.add(mid);
  run(() => { find(S.merchants, mid, 'تاجر غير موجود').cover = Date.now(); });
  toast('انحفظت صورة المحل');
}

/* ---------- زر تثبيت التطبيق ---------- */
(function () {
  let dp = null;
  const box = () => document.getElementById('inst');
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) && !/crios|fxios/i.test(ua);
  const snoozed = () => { try { return Date.now() < Number(localStorage.getItem('cb_inst_snooze') || 0); } catch (e) { return false; } };
  const snooze = d => { try { localStorage.setItem('cb_inst_snooze', String(Date.now() + d * 864e5)); } catch (e) {} };
  function hide() { const b = box(); if (b) b.classList.remove('show'); }
  function show(msg, withBtn) {
    const b = box(); if (!b || standalone() || snoozed()) return;
    b.innerHTML = '<img src="icon-192.png" alt=""><div class="t"><b>ثبّت CASH BACK</b>' + msg + '</div>' +
      (withBtn ? '<button class="go" id="inst_go">ثبّت</button>' : '') + '<button class="no" id="inst_no">لاحقًا</button>';
    b.classList.add('show');
    const no = document.getElementById('inst_no'); if (no) no.onclick = () => { snooze(3); hide(); };
    const go = document.getElementById('inst_go');
    if (go) go.onclick = async () => {
      if (!dp) return;
      try { dp.prompt(); const r = await dp.userChoice; if (r && r.outcome === 'accepted') toast('جاري تثبيت التطبيق'); else snooze(3); } catch (e) {}
      dp = null; hide();
    };
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; show('يفتح مباشرة من الشاشة الرئيسية بدون متصفح.', true); });
  window.addEventListener('appinstalled', () => { dp = null; hide(); try { toast('تم تثبيت التطبيق'); } catch (e) {} });
  window.addEventListener('load', () => setTimeout(() => {
    if (standalone() || dp) return;
    if (isIOS) show('اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية».', false);
    else if (/android/i.test(ua)) show('من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».', false);
  }, 4000));
})();
